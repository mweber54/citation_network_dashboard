<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stable 3D Hypergraph</title>
  <style>
    :root {
      --bg0: #0a0d14;
      --bg1: #0e1220;
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.52);
      --panel: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.10);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(90,110,255,0.10), transparent 28%),
        radial-gradient(circle at 50% 50%, rgba(100,240,220,0.04), transparent 36%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 16px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
      pointer-events: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.28);
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .footer {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>

    <div class="overlay">
      <div class="title">Stable 3D Hypergraph</div>
      <div class="subtitle">minimal · dynamic · centered</div>
    </div>

    <div class="footer">drag to rotate · wheel to zoom</div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    let w = 0, h = 0, dpr = 1;

    function resize() {
      w = innerWidth;
      h = innerHeight;
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    const TAU = Math.PI * 2;
    const NODE_COUNT = 140;
    const CLUSTER_COUNT = 4;
    const CLUSTER_RADIUS = 150;
    const LOCAL_SPREAD = 55;
    const CAMERA_Z_BASE = 900;

    function rand(a = 0, b = 1) {
      return a + Math.random() * (b - a);
    }

    function pick(arr) {
      return arr[(Math.random() * arr.length) | 0];
    }

    function vec(x = 0, y = 0, z = 0) {
      return { x, y, z };
    }

    function add(a, b) {
      return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z };
    }

    function sub(a, b) {
      return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
    }

    function mul(a, s) {
      return { x: a.x * s, y: a.y * s, z: a.z * s };
    }

    function len(a) {
      return Math.hypot(a.x, a.y, a.z);
    }

    function rotateX(p, a) {
      const c = Math.cos(a), s = Math.sin(a);
      return { x: p.x, y: p.y * c - p.z * s, z: p.y * s + p.z * c };
    }

    function rotateY(p, a) {
      const c = Math.cos(a), s = Math.sin(a);
      return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
    }

    let yaw = 0.8;
    let pitch = -0.35;
    let zoom = 1;
    let dragging = false;
    let lx = 0, ly = 0;

    canvas.addEventListener("pointerdown", e => {
      dragging = true;
      lx = e.clientX;
      ly = e.clientY;
    });

    addEventListener("pointerup", () => {
      dragging = false;
    });

    addEventListener("pointermove", e => {
      if (!dragging) return;
      const dx = e.clientX - lx;
      const dy = e.clientY - ly;
      lx = e.clientX;
      ly = e.clientY;
      yaw += dx * 0.005;
      pitch += dy * 0.005;
      pitch = Math.max(-1.0, Math.min(1.0, pitch));
    });

    addEventListener("wheel", e => {
      zoom *= Math.exp(-e.deltaY * 0.001);
      zoom = Math.max(0.7, Math.min(1.8, zoom));
    }, { passive: true });

    function project(p) {
      const camZ = CAMERA_Z_BASE / zoom;
      const dz = camZ - p.z;

      if (dz < 140) return null;

      const f = 540 / dz;
      return {
        x: w * 0.5 + p.x * f,
        y: h * 0.5 + p.y * f,
        s: f,
        z: p.z
      };
    }

    const clusters = [];
    const nodes = [];
    const edges = [];
    const hyperedges = [];

    function createGraph() {
      for (let i = 0; i < CLUSTER_COUNT; i++) {
        const a = i / CLUSTER_COUNT * TAU;
        clusters.push({
          center: vec(
            Math.cos(a) * CLUSTER_RADIUS,
            Math.sin(a * 1.7) * 45,
            Math.sin(a) * 90
          ),
          phase: rand(0, TAU),
          speed: rand(0.4, 0.9)
        });
      }

      for (let i = 0; i < NODE_COUNT; i++) {
        const cluster = i % CLUSTER_COUNT;
        const c = clusters[cluster];

        const base = add(c.center, vec(
          rand(-LOCAL_SPREAD, LOCAL_SPREAD),
          rand(-LOCAL_SPREAD, LOCAL_SPREAD),
          rand(-LOCAL_SPREAD, LOCAL_SPREAD)
        ));

        nodes.push({
          id: i,
          cluster,
          base,
          pos: { ...base },
          vel: vec(0, 0, 0),
          phase: rand(0, TAU),
          speed: rand(0.5, 1.2)
        });
      }

      for (let c = 0; c < CLUSTER_COUNT; c++) {
        const group = nodes.filter(n => n.cluster === c);

        for (const a of group) {
          for (let k = 0; k < 3; k++) {
            const b = pick(group);
            if (a.id !== b.id) edges.push([a.id, b.id, 0.9]);
          }

          if (Math.random() < 0.28) {
            const other = pick(nodes.filter(n => n.cluster !== c));
            edges.push([a.id, other.id, 0.35]);
          }
        }
      }

      for (let i = 0; i < 20; i++) {
        const cluster = i % CLUSTER_COUNT;
        const group = nodes.filter(n => n.cluster === cluster);
        const set = new Set();

        const size = 4 + ((Math.random() * 3) | 0);
        while (set.size < size) set.add(pick(group).id);

        if (Math.random() < 0.4) {
          set.add(pick(nodes.filter(n => n.cluster !== cluster)).id);
        }

        hyperedges.push([...set]);
      }
    }

    createGraph();

    function update(t) {
      for (const n of nodes) {
        const c = clusters[n.cluster];

        const clusterMotion = vec(
          Math.cos(t * 0.22 * c.speed + c.phase) * 20,
          Math.sin(t * 0.19 * c.speed + c.phase * 0.9) * 16,
          Math.cos(t * 0.25 * c.speed + c.phase * 1.1) * 18
        );

        const localMotion = vec(
          Math.cos(t * 0.70 * n.speed + n.phase) * 10,
          Math.sin(t * 0.85 * n.speed + n.phase * 1.3) * 10,
          Math.cos(t * 0.66 * n.speed + n.phase * 0.8) * 10
        );

        const target = add(add(c.center, sub(n.base, clusters[n.cluster].center)), add(clusterMotion, localMotion));
        const toward = sub(target, n.pos);

        n.vel.x += toward.x * 0.01;
        n.vel.y += toward.y * 0.01;
        n.vel.z += toward.z * 0.01;

        n.vel.x *= 0.88;
        n.vel.y *= 0.88;
        n.vel.z *= 0.88;

        n.pos.x += n.vel.x;
        n.pos.y += n.vel.y;
        n.pos.z += n.vel.z;
      }
    }

    function transformedNode(n, autoYaw) {
      let p = { ...n.pos };
      p = rotateY(p, yaw + autoYaw);
      p = rotateX(p, pitch);
      return p;
    }

    function drawGlow() {
      const g = ctx.createRadialGradient(
        w * 0.5, h * 0.5, 0,
        w * 0.5, h * 0.5, Math.min(w, h) * 0.33
      );
      g.addColorStop(0, "rgba(95,115,255,0.10)");
      g.addColorStop(0.45, "rgba(95,115,255,0.03)");
      g.addColorStop(1, "rgba(95,115,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(w * 0.5, h * 0.5, Math.min(w, h) * 0.33, 0, TAU);
      ctx.fill();
    }

    function convexHull(points) {
      if (points.length < 3) return points.slice();

      const pts = points
        .map((p, i) => ({ x: p.x, y: p.y, i }))
        .sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);

      function cross(o, a, b) {
        return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      }

      const lower = [];
      for (const p of pts) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) {
          lower.pop();
        }
        lower.push(p);
      }

      const upper = [];
      for (let i = pts.length - 1; i >= 0; i--) {
        const p = pts[i];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) {
          upper.pop();
        }
        upper.push(p);
      }

      upper.pop();
      lower.pop();
      return lower.concat(upper).map(p => points[p.i]);
    }

    function drawHyperedge(poly, alpha) {
      if (poly.length < 3) return;
      const hull = convexHull(poly);
      if (hull.length < 3) return;

      ctx.beginPath();
      ctx.moveTo(hull[0].x, hull[0].y);
      for (let i = 1; i < hull.length; i++) {
        ctx.lineTo(hull[i].x, hull[i].y);
      }
      ctx.closePath();

      ctx.fillStyle = `rgba(110,135,255,${0.04 + alpha * 0.06})`;
      ctx.strokeStyle = `rgba(130,155,255,${0.12 + alpha * 0.10})`;
      ctx.lineWidth = 1;
      ctx.fill();
      ctx.stroke();
    }

    function render(t) {
      ctx.clearRect(0, 0, w, h);
      drawGlow();

      const autoYaw = t * 0.08;

      const transformed = nodes.map(n => transformedNode(n, autoYaw));
      const projected = transformed.map(project);

      const items = [];

      for (const set of hyperedges) {
        const pts = [];
        let zSum = 0;
        let ok = true;

        for (const id of set) {
          const p = projected[id];
          if (!p) {
            ok = false;
            break;
          }
          pts.push(p);
          zSum += transformed[id].z;
        }

        if (ok) {
          items.push({
            type: "hyper",
            z: zSum / set.length,
            pts
          });
        }
      }

      for (const [aId, bId, weight] of edges) {
        const a = projected[aId];
        const b = projected[bId];
        if (!a || !b) continue;

        items.push({
          type: "edge",
          z: (transformed[aId].z + transformed[bId].z) * 0.5,
          a, b, weight
        });
      }

      for (let i = 0; i < nodes.length; i++) {
        const p = projected[i];
        if (!p) continue;
        items.push({
          type: "node",
          z: transformed[i].z,
          p
        });
      }

      items.sort((a, b) => a.z - b.z);

      for (const item of items) {
        if (item.type === "hyper") {
          const alpha = Math.max(0.2, Math.min(1, (item.z + 260) / 520));
          drawHyperedge(item.pts, alpha);
        } else if (item.type === "edge") {
          const alpha = item.weight > 0.7 ? 0.42 : 0.18;
          ctx.beginPath();
          ctx.moveTo(item.a.x, item.a.y);
          ctx.lineTo(item.b.x, item.b.y);
          ctx.strokeStyle = item.weight > 0.7
            ? `rgba(155,175,255,${alpha})`
            : `rgba(120,145,255,${alpha})`;
          ctx.lineWidth = item.weight > 0.7 ? 1.15 : 0.9;
          ctx.stroke();
        } else {
          const r = Math.max(1.2, Math.min(2.8, item.p.s * 0.016));
          ctx.beginPath();
          ctx.arc(item.p.x, item.p.y, r, 0, TAU);
          ctx.fillStyle = "rgba(220,228,255,0.92)";
          ctx.fill();
        }
      }
    }

    let start = performance.now();

    function frame(now) {
      const t = (now - start) * 0.001;
      update(t);
      render(t);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
